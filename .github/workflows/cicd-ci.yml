name: CI

on:
  pull_request:
    paths:
      - charts/paperless-ngx/**
      - config/bitnami-readme-gen.json
      - .github/workflows/cicd-ci.yml
      - .github/workflows/cicd-release.yml
      - .github/workflows/cicd-release-please.yml
  push:
    branches:
      - "**"
    paths:
      - charts/paperless-ngx/**
      - config/bitnami-readme-gen.json
      - .github/workflows/cicd-ci.yml
      - .github/workflows/cicd-release.yml
      - .github/workflows/cicd-release-please.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Generate docs and schema
        run: make gen

      - name: Ensure generated files are committed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- charts/paperless-ngx/README.md charts/paperless-ngx/values.schema.json; then
            echo "Generated files are out of date. Run 'make gen' and commit changes."
            git --no-pager diff -- charts/paperless-ngx/README.md charts/paperless-ngx/values.schema.json
            exit 1
          fi

      - name: Lint chart with chart-testing
        run: ct lint --config config/ct-config.yaml --charts charts/paperless-ngx

      - name: Install chart in Kind cluster with chart-testing
        run: ct install --config config/ct-config.yaml --charts charts/paperless-ngx

      - name: Render templates with defaults
        run: make template

      - name: Render templates with test values
        run: make template VALUES=ci/test-values.yaml

      - name: Dry-run install with test values
        run: make dry-install VALUES=ci/test-values.yaml
