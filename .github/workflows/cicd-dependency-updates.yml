name: Dependency Updates

on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: adnoctem/helm
          LOG_LEVEL: info
